name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:           # builds and uploads the zip as a workflow artifact only
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - name: Build the zip and its checksum
        run: |
          bash scripts/make_release.sh
          cd dist && shasum -a 256 FocusMerge-*.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: FocusMerge-release
          path: |
            dist/FocusMerge-*.zip
            dist/SHA256SUMS.txt
      - name: Publish to the GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/FocusMerge-*.zip dist/SHA256SUMS.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/FocusMerge-*.zip dist/SHA256SUMS.txt \
              --title "FocusMerge ${GITHUB_REF_NAME#v}" --generate-notes
          fi
